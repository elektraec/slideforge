<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi clase · SlideForge</title><link rel="stylesheet" href="../../../runtime/player.css"></head><body><div class="reveal"><div class="slides" id="slides"></div></div><script type="application/json" id="slideforge-project">{"version":1,"config":{"title":"Mi clase","author":"","course":"","institution":"","theme":"institutional","transition":"slide","ratio":"16:9","controls":true,"progress":true,"slideNumber":true,"customCss":"","customJs":"","enableCustomJs":false,"branding":{"logo":"","logoPosition":"bottom-right","logoMode":"all","colors":{"dark":"#3a1467","primary":"#542e91","soft":"#644a98","orange":"#f37121","yellow":"#ffd54c","white":"#ffffff"}}},"slides":[{"id":"3a68915c-ad78-499c-be0c-763b66327451","kind":"content","name":"Introducción a IHM","content":"# Introducción a IHM\n\n## Interacción, interfaz, UI, UX y usabilidad\n\n**Asignatura:** Interacción Hombre-Máquina  \n**Tema:** Fundamentos y análisis de interfaces cotidianas  \n**Modalidad:** Clase introductoria interactiva\n\n\n\n:::mermaid\nerDiagram\n    CAR ||--o{ NAMED-DRIVER : allows\n    CAR {\n        string registrationNumber PK\n        string make\n        string model\n        string[] parts\n    }\n    PERSON ||--o{ NAMED-DRIVER : is\n    PERSON {\n        string driversLicense PK \"The license #\"\n        string(99) firstName \"Only 99 characters are allowed\"\n        string lastName\n        string phone UK\n        int age\n    }\n    NAMED-DRIVER {\n        string carRegistrationNumber PK, FK\n        string driverLicence PK, FK\n    }\n    MANUFACTURER only one to zero or more CAR : makes\n\n:::","notes":"Presenta la sesión como una introducción práctica. Explica que se analizarán interfaces cotidianas, no solo aplicaciones sofisticadas. Relaciona el tema con experiencias reales: Canvas LMS, apps bancarias, cajeros, formularios web y servicios móviles."},{"id":"36f833a5-b9f0-4af5-a5c9-7ee6e865ab0a","kind":"content","name":"Propósito de la clase","content":"# Propósito de la clase\n\nAl finalizar, podrás:\n\n- diferenciar interacción, interfaz, UI, UX y usabilidad;\n- reconocer la evolución de los paradigmas de interacción;\n- explicar el diseño centrado en las personas;\n- comparar interfaces cotidianas usando criterios básicos de IHM.","notes":"Explica que IHM no se limita al diseño visual. Incluye personas, tareas, contexto, tecnología, accesibilidad, emociones, errores y evaluación."},{"id":"b63ba2de-7f5b-4dd6-a433-a69b664cdbdb","kind":"content","name":"Pregunta inicial","content":"# Pregunta inicial\n\n:::quiz\nquestion: Cuando una aplicación es difícil de usar, ¿cuál suele ser una causa probable?\n- [ ] El usuario no sabe usar tecnología\n- [ ] La pantalla tiene pocos colores\n- [x] La interfaz no comunica bien cómo interactuar\n- [ ] El dispositivo siempre es el problema\nfeedback: Correcto. Muchas dificultades aparecen porque la interfaz no orienta, no da feedback o no coincide con las expectativas del usuario.\n:::","notes":"Usa esta pregunta para desmontar la idea de que el error siempre pertenece al usuario. En IHM se analiza la relación entre persona, tarea, interfaz y contexto."},{"id":"2b9807fa-9e5c-4954-8543-39a9be4b4bf3","kind":"content","name":"¿Qué estudia la IHM?","content":"# ¿Qué estudia la IHM?\n\nLa **Interacción Hombre-Máquina** estudia cómo las personas interactúan con sistemas tecnológicos.\n\nIncluye:\n\n- personas;\n- objetivos;\n- tareas;\n- contexto;\n- dispositivos;\n- interfaces;\n- experiencia;\n- evaluación.","notes":"Aclara que también se usa el término Interacción Humano-Computadora. Explica que una máquina puede ser una app, una web, un cajero, un auto, un sistema de IA, un dispositivo médico o una plataforma educativa."},{"id":"9c6c3c2b-087a-4a0d-9832-43b6db8a44e6","kind":"content","name":"Interacción","content":"# Interacción\n\nLa **interacción** es el intercambio entre una persona y un sistema.\n\n:::mermaid\nflowchart LR\n  subgraph Client\n    UI[Web app]\n    Cache[(Local cache)]\n  end\n  subgraph Services\n    API[API gateway]\n    Auth[Auth service]\n    Orders[Order service]\n  end\n  subgraph Storage\n    DB[(Orders DB)]\n  end\n  UI --> API\n  UI --> Cache\n  API --> Auth\n  API --> Orders\n  Orders --> DB\n  Auth -. token .-> UI\n\n:::\n\nEjemplos:\n\n- tocar un botón;\n- escribir una búsqueda;\n- arrastrar un archivo;\n- recibir una alerta;\n- corregir un error.","notes":"Explica que la interacción no es solo entrada de datos. También incluye interpretación, respuesta del sistema, aprendizaje, corrección y toma de decisiones."},{"id":"2fd7585a-65fb-4585-bf26-bd8786587374","kind":"content","name":"Interfaz","content":"# Interfaz\n\nLa **interfaz** es el punto de contacto entre la persona y el sistema.\n\nPuede ser:\n\n- gráfica;\n- táctil;\n- verbal;\n- física;\n- gestual;\n- conversacional;\n- multimodal.\n\n:::flashcards\n- Interfaz gráfica | Pantallas, botones, menús, formularios e íconos\n- Interfaz física | Teclado, mouse, volante, cajero, control remoto\n- Interfaz conversacional | Chatbot, asistente de voz o sistema de diálogo\n- Interfaz gestual | Gestos táctiles, corporales o de movimiento\n:::","notes":"Pide ejemplos a los estudiantes. Puedes usar Canvas LMS, WhatsApp, cajeros automáticos, ascensores, aplicaciones bancarias, controles de televisión y sistemas de turnos."},{"id":"0ecc0447-2dee-4f53-b3a5-c55df04a2ce9","kind":"content","name":"UI y UX","content":"# UI y UX\n\n**UI** y **UX** están relacionadas, pero no son lo mismo.\n\n| Concepto | Se enfoca en | Pregunta clave |\n|---|---|---|\n| UI | Elementos visibles e interactivos | ¿Cómo se ve y se usa la interfaz? |\n| UX | Experiencia completa | ¿Cómo se siente y funciona la experiencia? |\n| Usabilidad | Facilidad para lograr objetivos | ¿Es fácil, eficiente y satisfactorio? |","notes":"Da un ejemplo: una app puede verse moderna pero ser frustrante. En ese caso puede tener una UI atractiva, pero mala UX o baja usabilidad."},{"id":"61f7b64b-8087-43b0-a292-285e37cf07e5","kind":"content","name":"Actividad: UI o UX","content":"# Actividad: UI o UX\n\n:::match\ntitle: Relaciona cada situación con el concepto más adecuado\npairs:\n- Color del botón principal | UI\n- Tamaño de los íconos | UI\n- Tipografía de los menús | UI\n- El usuario abandona una compra por demasiados pasos | UX\n- Sensación de confianza al usar banca móvil | UX\n- Facilidad para completar una tarea completa | UX\nfeedback: UI se concentra en los elementos visibles e interactivos. UX considera la experiencia completa antes, durante y después del uso.\n:::","notes":"Pide que justifiquen una o dos respuestas. El objetivo es que comprendan que UI forma parte de UX, pero no la reemplaza."},{"id":"e5a221ff-fc87-4185-bfc4-75373610b89c","kind":"content","name":"Usabilidad","content":"# Usabilidad\n\nLa **usabilidad** describe qué tan fácil, eficiente y satisfactorio es usar un sistema para lograr objetivos concretos.\n\nPreguntas guía:\n\n- ¿Puedo entender qué hacer?\n- ¿Puedo hacerlo sin cometer errores graves?\n- ¿Puedo completar la tarea con satisfacción?\n- ¿Puedo aprender a usarlo con facilidad?\n\n:::truefalse\nquestion: Una interfaz visualmente atractiva siempre tiene buena usabilidad.\nanswer: false\nfeedback: Falso. La estética puede ayudar, pero no garantiza comprensión, eficiencia, prevención de errores ni satisfacción.\n:::","notes":"Explica que la usabilidad se evalúa con usuarios reales, tareas concretas y contextos específicos."},{"id":"b0b4154b-c2a6-481b-9e7d-4b2f1c31c215","kind":"content","name":"Dimensiones de la usabilidad","content":"# Dimensiones de la usabilidad\n\n:::tabs\ntab: Eficacia\nEl usuario logra completar la tarea prevista.\n\nEjemplo: pagar una factura sin errores.\n\ntab: Eficiencia\nLa tarea requiere tiempo y esfuerzo razonables.\n\nEjemplo: realizar una transferencia en pocos pasos claros.\n\ntab: Satisfacción\nEl usuario percibe control, confianza y comodidad.\n\nEjemplo: una app bancaria que transmite seguridad.\n\ntab: Aprendizaje\nEl sistema puede entenderse sin entrenamiento excesivo.\n\nEjemplo: un formulario claro desde el primer uso.\n:::","notes":"Invita a pensar en una app usada durante la semana. Pregunta si fue eficaz, eficiente, satisfactoria y fácil de aprender."},{"id":"c3e20814-0397-43d8-8892-3b79f2b10e9c","kind":"content","name":"Evolución de las interfaces","content":"# Evolución de las interfaces\n\n:::mermaid\ntimeline\n    title Evolución de paradigmas de interacción\n    1950s : Computación por lotes\n    1970s : Línea de comandos\n    1980s : Interfaces gráficas\n    1990s : Web\n    2000s : Móvil y táctil\n    2010s : Voz, sensores y nube\n    2020s : IA conversacional, realidad extendida y sistemas contextuales\n:::","notes":"Explica que la evolución no elimina completamente paradigmas anteriores. Terminal, web, móvil, voz e IA conviven en distintos contextos."},{"id":"a01198d3-8d5f-4621-99f4-88244c9b1641","kind":"content","name":"Paradigmas de interacción","content":"# Paradigmas de interacción\n\n:::accordion\ntitle: Línea de comandos\nPrecisa y rápida para usuarios expertos, pero poco amigable para principiantes.\n\ntitle: Interfaz gráfica\nUsa ventanas, íconos, menús y puntero. Facilita el reconocimiento visual.\n\ntitle: Interacción táctil\nPermite tocar, deslizar, pellizcar y arrastrar directamente sobre la pantalla.\n\ntitle: Voz y conversación\nPermite expresar intenciones mediante lenguaje natural.\n\ntitle: Realidad extendida\nIntegra elementos digitales con espacios físicos o virtuales.\n\ntitle: IA conversacional\nEl sistema interpreta, responde y genera contenido mediante diálogo.\n:::","notes":"Resalta que no existe un paradigma perfecto para todos los casos. La selección depende de usuario, tarea, contexto, riesgo y dispositivo."},{"id":"48d8ec00-7753-4eab-bec6-d5d19d7abac0","kind":"content","name":"Mini debate","content":"# Mini debate\n\n:::quiz\nquestion: ¿Qué paradigma sería más apropiado para cambiar la música mientras se conduce?\n- [ ] Formulario largo\n- [ ] Tabla con muchas opciones\n- [x] Voz o controles físicos simples\n- [ ] Menú con varios niveles\nfeedback: Correcto. En ese contexto importan la seguridad, la atención y la reducción de carga visual.\n:::","notes":"Conecta la respuesta con contexto de uso. Una interfaz útil en escritorio puede ser peligrosa en movilidad."},{"id":"6c19d040-73bf-4521-ade4-252d30f1d0fe","kind":"content","name":"Diseño centrado en las personas","content":"# Diseño centrado en las personas\n\nEl diseño centrado en las personas busca comprender necesidades reales antes de construir soluciones.\n\n:::mermaid\nflowchart LR \n    Comprender[Comprender personas y contexto] --> Definir[Definir problema]\n    Definir --> Idear[Idear soluciones]\n    Idear --> Prototipar[Prototipar]\n    Prototipar --> Evaluar[Evaluar con usuarios]\n    Evaluar --> Comprender\n:::","notes":"Explica que el proceso es iterativo. Se aprende mediante observación, prototipos, pruebas y mejoras sucesivas."},{"id":"b5f61700-9b40-41dd-a381-46ee3bb9facc","kind":"content","name":"Principios del diseño centrado en las personas","content":"# Principios del diseño centrado en las personas\n\n- Observar antes de asumir.\n- Diseñar para tareas reales.\n- Prototipar temprano.\n- Evaluar con usuarios.\n- Iterar con evidencia.\n- Considerar accesibilidad e inclusión.\n\n:::sort\ntitle: Ordena el proceso de diseño centrado en las personas\nitems:\n- Comprender usuarios y contexto\n- Definir el problema\n- Idear soluciones\n- Prototipar\n- Evaluar con usuarios\nanswer:\n- Comprender usuarios y contexto\n- Definir el problema\n- Idear soluciones\n- Prototipar\n- Evaluar con usuarios\nfeedback: El proceso puede repetirse varias veces, pero comprender a las personas debe ocurrir antes de proponer soluciones.\n:::","notes":"Aclara que diseñar no es decorar pantallas. Diseñar es tomar decisiones informadas para facilitar la interacción."},{"id":"03be4ccf-1ccf-43fc-992b-6abc129dd957","kind":"content","name":"Caso cotidiano: cajero automático","content":"# Caso cotidiano: cajero automático\n\nAnaliza un cajero automático desde IHM:\n\n- ¿La tarea principal es clara?\n- ¿Los botones corresponden a lo que se muestra?\n- ¿El sistema da feedback?\n- ¿Previene errores?\n- ¿Permite cancelar?\n- ¿Protege la privacidad?\n\n:::hotspot\nimage: assets/cajero-ejemplo.png\ntitle: Zonas críticas de análisis\npoints:\n- x: 20\n  y: 25\n  label: Pantalla\n  feedback: Verificar claridad de instrucciones, tamaño de texto y mensajes de confirmación.\n- x: 75\n  y: 35\n  label: Botones\n  feedback: Revisar correspondencia entre botones físicos y opciones en pantalla.\n- x: 55\n  y: 75\n  label: Ranuras\n  feedback: Comprobar si la ubicación y señalización reducen errores de uso.\nfallback: Si no hay imagen, analiza un cajero que hayas usado recientemente y ubica mentalmente pantalla, botones, ranuras y mensajes.\n:::","notes":"La imagen es opcional para probar el componente hotspot. Si no existe el archivo, usar el fallback conceptual. Pregunta qué errores han visto en cajeros reales."},{"id":"4f188bd5-a8dd-410b-89c2-a941e702864e","kind":"content","name":"Caso cotidiano: formulario web","content":"# Caso cotidiano: formulario web\n\nUn formulario universitario pide:\n\n- nombres completos;\n- cédula;\n- correo;\n- teléfono;\n- carrera;\n- modalidad;\n- jornada;\n- archivo PDF;\n- aceptación de términos.\n\n:::quiz\nquestion: ¿Qué mejora tendría mayor impacto en la usabilidad del formulario?\n- [ ] Poner más colores\n- [x] Validar errores en el momento y explicar cómo corregirlos\n- [ ] Ocultar las etiquetas\n- [ ] Usar únicamente íconos\nfeedback: Correcto. La prevención y corrección clara de errores reduce frustración, tiempo perdido y abandono.\n:::","notes":"Explica la diferencia entre decir \"campo inválido\" y explicar \"ingrese un correo con formato nombre@dominio.com\"."},{"id":"be46d1af-a32c-4f34-ac2f-6382fb750e03","kind":"content","name":"Análisis comparativo de interfaces","content":"# Análisis comparativo de interfaces\n\nCriterios básicos:\n\n| Criterio | Pregunta |\n|---|---|\n| Claridad | ¿Se entiende qué hacer? |\n| Consistencia | ¿Los elementos funcionan de manera similar? |\n| Feedback | ¿El sistema informa lo que ocurre? |\n| Prevención de errores | ¿Evita acciones peligrosas? |\n| Accesibilidad | ¿Puede usarla diversidad de personas? |\n| Eficiencia | ¿Reduce pasos innecesarios? |\n| Satisfacción | ¿Genera confianza y control? |","notes":"Presenta esta tabla como mini rúbrica. Indica que se debe justificar cada evaluación con evidencia observable."},{"id":"7eccb5cf-408f-4bdb-aafa-89be8cd37207","kind":"content","name":"Actividad: compara dos interfaces","content":"# Actividad: compara dos interfaces\n\nElige dos interfaces cotidianas:\n\n- app bancaria y app de delivery;\n- Canvas LMS y correo institucional;\n- cajero automático y app móvil;\n- formulario antiguo y formulario moderno;\n- app de transporte y sitio web municipal.\n\nEvalúa de 1 a 5:\n\n| Criterio | Interfaz A | Interfaz B | Evidencia |\n|---|---:|---:|---|\n| Claridad |  |  |  |\n| Eficiencia |  |  |  |\n| Feedback |  |  |  |\n| Prevención de errores |  |  |  |\n| Accesibilidad |  |  |  |\n| Satisfacción |  |  |  |","notes":"Usar como trabajo individual o grupal. La evidencia puede ser número de pasos, mensajes del sistema, errores comunes, navegación o claridad del lenguaje."},{"id":"678563bb-591c-4bac-b05b-190b74872ab7","kind":"content","name":"Slider: esfuerzo percibido","content":"# Slider: esfuerzo percibido\n\n:::slider\nlabel: Esfuerzo necesario para completar una tarea\nmin: 1\nmax: 10\nvalue: 5\nlowLabel: Muy fácil\nhighLabel: Muy difícil\nfeedback:\n- 1-3: La tarea parece simple, clara y fluida.\n- 4-7: Hay fricción moderada. Conviene revisar pasos, mensajes y jerarquía visual.\n- 8-10: La experiencia puede causar errores, abandono o frustración.\n:::","notes":"Usa el slider para explicar que la experiencia también puede analizarse desde la percepción del usuario, no solo desde métricas técnicas."},{"id":"45df3f21-8345-42a4-bc54-d407049254a3","kind":"content","name":"Problemas frecuentes de usabilidad","content":"# Problemas frecuentes de usabilidad\n\nAlgunos patrones problemáticos:\n\n- botones sin etiqueta clara;\n- mensajes de error ambiguos;\n- demasiados pasos;\n- navegación inconsistente;\n- lenguaje técnico;\n- falta de confirmación;\n- información importante oculta;\n- dependencia exclusiva del color.\n\n:::truefalse\nquestion: Si una interfaz usa rojo para error y verde para éxito, ya es accesible.\nanswer: false\nfeedback: Falso. No se debe depender solo del color. También se requieren textos, íconos, contraste suficiente y estados claros.\n:::","notes":"Introduce accesibilidad de manera breve. Menciona daltonismo, lectores de pantalla, contraste, tamaño de texto y navegación por teclado."},{"id":"446ffd10-0498-4b7a-aec7-8fe904fb2554","kind":"content","name":"Relación entre UI, UX y usabilidad","content":"# Relación entre UI, UX y usabilidad\n\n:::mermaid\nflowchart TD\n    UI[UI: interfaz visible e interactiva]\n    Usabilidad[Usabilidad: facilidad para lograr objetivos]\n    UX[UX: experiencia completa]\n    Contexto[Contexto de uso]\n    Persona[Persona usuaria]\n\n    UI --> Usabilidad\n    Usabilidad --> UX\n    Contexto --> UX\n    Persona --> UX\n    Contexto --> Usabilidad\n:::","notes":"Explica que UI influye en UX, pero UX también depende de expectativas, contexto, emociones, confianza, tarea y resultado."},{"id":"32fa7ffa-abc7-4030-9dcf-428fbca31a84","kind":"content","name":"Síntesis de conceptos","content":"# Síntesis de conceptos\n\n:::flashcards\n- IHM | Estudio de la interacción entre personas y sistemas tecnológicos\n- Interacción | Intercambio de acciones y respuestas entre persona y sistema\n- Interfaz | Punto de contacto entre persona y sistema\n- UI | Elementos visibles e interactivos de la interfaz\n- UX | Experiencia completa de uso\n- Usabilidad | Facilidad, eficiencia y satisfacción al lograr objetivos\n- Diseño centrado en personas | Proceso que parte de necesidades, tareas y contexto reales\n:::","notes":"Usa las flashcards para repasar antes de la evaluación rápida. Pide a un estudiante explicar un concepto con sus propias palabras."},{"id":"7872640b-a626-4fd8-a16d-ce1b4800c44b","kind":"content","name":"Evaluación rápida","content":"# Evaluación rápida\n\n:::quiz\nquestion: ¿Cuál afirmación resume mejor la relación entre UI y UX?\n- [ ] UI y UX son exactamente lo mismo\n- [x] UI es parte de la experiencia, pero UX incluye más aspectos\n- [ ] UX solo trata de colores\n- [ ] UI no afecta la experiencia\nfeedback: Correcto. La UI influye en la UX, pero la experiencia también depende de contexto, tareas, expectativas, confianza y resultados.\n:::","notes":"Si hay respuestas incorrectas, volver a la tabla UI, UX y usabilidad."},{"id":"43b2f0c2-5e19-4cb8-b520-e68cdcda0f95","kind":"content","name":"Actividad final","content":"# Actividad final\n\n## Análisis de una interfaz cotidiana\n\nSelecciona una interfaz que uses frecuentemente.\n\nEntrega breve:\n\n1. captura o descripción;\n2. tarea principal;\n3. tres aciertos;\n4. tres problemas;\n5. propuesta de mejora;\n6. justificación desde IHM, UI, UX y usabilidad.","notes":"Esta actividad puede convertirse en tarea o foro en Canvas LMS. Solicita evidencia concreta, no solo opiniones generales."},{"id":"e5de88a0-4847-4c02-983d-7c2d26450a61","kind":"content","name":"Cierre","content":"# Cierre\n\n## Próxima sesión\n\n**Evaluación heurística y principios de usabilidad**\n\nIdea final:\n\n> Una buena interfaz no obliga al usuario a pensar en la interfaz; le permite concentrarse en su objetivo.","notes":"Cierra conectando con la siguiente clase. Explica que se estudiarán criterios para evaluar interfaces de manera más sistemática."}],"assets":{}}</script><script src="../../../runtime/player.js"></script></body></html>
